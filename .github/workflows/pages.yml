name: Pages

# Deploy the SuperBand Web Bluetooth client whenever src/ changes on the default branch.

on:
  push:
    branches:
      - master
      - main
    paths:
      - "src/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Resolve Pages base path
        id: base
        run: |
          set -euo pipefail
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io ]]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/${REPO}/" >> "$GITHUB_OUTPUT"
          fi
          echo "Base path: $(tail -1 "$GITHUB_OUTPUT")"

      - name: Install and build client
        working-directory: src
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # CalVer: YYYY.MM.DD.<GitHub run number>
          export APP_VERSION="$(date -u +%Y.%m.%d).${BUILD_NUMBER}"
          echo "Building SuperBand ${APP_VERSION}"
          bun install --frozen-lockfile
          bun run build

      - name: Assemble Pages site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -a src/dist/. _site/
          # Ship debug console beside the manager (static assets, no Bun build)
          mkdir -p _site/debug-console
          cp -a src/debug-console/. _site/debug-console/
          test -f _site/index.html
          test -f _site/.nojekyll
          test -f _site/version.json
          test -f _site/debug-console/index.html
          echo "Deploy version: $(python3 -c "import json; print(json.load(open('_site/version.json'))['version'])")"
          head -n 16 _site/index.html

      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
